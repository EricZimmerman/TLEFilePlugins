# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: test
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6  # SDK version from global.json
    - name: Run tests
      run: dotnet test TLEFilePlugins.slnx --configuration Release
